# SETUP: rename this, the src/ package directory, and bundle.name in databricks.yml.
[project]
name = "project-name"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# The app half only. A jobs-only project runs `uv sync` and never installs a web framework.
[project.optional-dependencies]
app = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pyright>=1.1.411",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks carry injected globals and magic commands that do not parse as Python.
builtins = ["dbutils", "spark", "display"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests", "app/backend"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
