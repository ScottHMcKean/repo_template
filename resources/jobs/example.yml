# Here to show the shape. Delete it once you have a real job.
resources:
  jobs:
    example:
      name: ${bundle.name} example
      tasks:
        - task_key: resolve_target
          notebook_task:
            notebook_path: ../../notebooks/example.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
