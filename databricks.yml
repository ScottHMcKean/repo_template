# SETUP: rename to match the src/ package directory, underscores included. The catalog
# name derives from it, and Unity Catalog rejects hyphens.
bundle:
  name: project_name
  databricks_cli_version: ">= 1.0.0"

artifacts:
  default:
    type: whl
    build: uv build --wheel

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Unity Catalog catalog. Derived per target so environments cannot collide.
    default: ${bundle.name}_${bundle.target}
  schema:
    description: Schema within the catalog.
    default: default

# No host here. It comes from your CLI profile, or DATABRICKS_HOST in CI.
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    # Keyed to the deploying identity so prod has one copy rather than one per person. Set
    # the service principal below and that identity stops depending on who ran the deploy.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # SETUP: your own service principal, so prod does not run as whoever deployed it.
    # run_as:
    #   service_principal_name: 00000000-0000-0000-0000-000000000000
